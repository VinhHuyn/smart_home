name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile tracked Python files
        run: |
          python - <<'PY'
          import py_compile
          import subprocess

          files = subprocess.check_output(
              ['git', 'ls-files', 'backend/*.py', '.github/scripts/*.py'],
              text=True,
          ).splitlines()

          for path in files:
              py_compile.compile(path, doraise=True)
              print(f'compiled {path}')
          PY

      - name: Run backend unit tests
        run: |
          cd backend
          python -m unittest discover -s tests -p 'test_*.py' -v

  docs-and-safety:
    name: Docs and safety checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js for JavaScript syntax checks
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Scan tracked files for obvious leaked secrets
        run: python .github/scripts/secret_scan.py

      - name: Validate HTML script blocks
        run: python .github/scripts/check_html_scripts.py docs/SMART_HOME_API_DOCS.html
