services:
  homeassistant:
    container_name: homeassistant
    image: ghcr.io/home-assistant/home-assistant:stable
    platform: linux/arm64
    volumes:
      - ./config:/config
    ports:
      - "8123:8123"
    environment:
      - TZ=America/Toronto
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8123/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    mem_limit: 2g
    cpus: 2.0

  backend:
    container_name: smart-home-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    platform: linux/arm64
    depends_on:
      - homeassistant
    environment:
      - TZ=America/Toronto
      - SMART_HOME_API_KEY=${SMART_HOME_API_KEY}
      - HOME_ASSISTANT_BASE_URL=${HOME_ASSISTANT_BASE_URL:-http://homeassistant:8123}
      - HOME_ASSISTANT_TOKEN=${HOME_ASSISTANT_TOKEN}
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/ha/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    mem_limit: 768m
    cpus: 1.0
